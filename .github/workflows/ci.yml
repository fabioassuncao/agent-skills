name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22, 24]

    defaults:
      run:
        working-directory: packages/issue-flow

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - run: npm install

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # The binary is only ever exercised here. A load-time defect — an option
      # registered twice, a bad import — throws before any command runs and no
      # unit test sees it, because none of them import the entry point.
      - run: node dist/cli.js --help
