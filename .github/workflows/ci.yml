name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22, 24]

    defaults:
      run:
        working-directory: packages/issue-flow

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - run: npm ci

      # The typed HTTP contract is a sibling package with its own lockfile: it
      # pins zod 3 (what @ts-rest/core peers on) while the CLI runs on zod 4,
      # and keeping the two installs apart is what stops one from dragging the
      # other's major along. The dashboard build resolves it from here.
      - run: npm run contract:install

      - run: npm run test:contract

      - run: npm run skills:check

      - run: npm run skills:test

      - run: npm run skills:eval -- --check

      - run: npm run skills:install-test
        if: runner.os == 'Linux' && matrix.node-version == 22

      - run: npm run lint

      - run: npm run typecheck

      # `tsc` covers `src/**` only; the dashboard is Svelte and needs its own
      # type check, which is also what verifies the component props.
      - run: npm run check:web

      - name: Install completion parser runtimes
        if: runner.os == 'Linux' && matrix.node-version == 22
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish zsh
          command -v pwsh

      - name: Validate every generated shell completion script
        if: runner.os == 'Linux' && matrix.node-version == 22
        env:
          ISSUE_FLOW_REQUIRE_ALL_COMPLETION_SHELLS: '1'
        run: npm test -- src/completion.test.ts

      - run: npm test

      # The dashboard suite runs in a DOM, against `web/src/**`. It is a
      # separate config on purpose: merging it would make the Node suite pay for
      # a browser environment it never uses.
      - run: npm run test:web

      - run: npm run build

      # The binary is only ever exercised here. A load-time defect — an option
      # registered twice, a bad import — throws before any command runs and no
      # unit test sees it, because none of them import the entry point.
      - run: node dist/cli.js --help

      - run: npm run skills:cli-test
        if: runner.os == 'Linux' && matrix.node-version == 22
