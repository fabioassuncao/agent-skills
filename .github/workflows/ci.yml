name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22, 24]

    defaults:
      run:
        working-directory: packages/issue-flow

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - run: npm ci

      - run: npm run lint

      # The Agent Skills are a published interface, and the ways they break are
      # invisible from inside this repository: a `../` reference resolves here
      # and dangles wherever a skill is installed.
      - run: npm run skills:sync
      - run: npm run skills:check

      # And the working tree is not what users install — it holds sources. This
      # assembles the tree the `skills` branch publishes and validates it
      # strictly, so a broken artifact fails on the PR rather than on the user.
      - run: npm run skills:verify

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # The binary is only ever exercised here. A load-time defect — an option
      # registered twice, a bad import — throws before any command runs and no
      # unit test sees it, because none of them import the entry point.
      - run: node dist/cli.js --help
