name: "✨ Feature"
description: "A new capability or a change to what the product does."
type: "Feature"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is not possible today, and for whom.
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What becomes true when this is done.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and out of scope
      description: What is included, and what is deliberately not.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How anyone can tell this is done. Checks that fail today and pass afterwards.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: What has to exist first, and what could go wrong.
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links, related issues, prior discussion, evidence.
