name: "🔬 Research"
description: "An investigation that produces knowledge: analysis, benchmark, feasibility."
type: "Research"
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
      description: The decision this investigation has to unblock.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What is already known, and why the question is open.
  - type: textarea
    id: deliverable
    attributes:
      label: Expected deliverable
      description: A conclusion and a recommendation. Say where durable knowledge will be written down.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links, related issues, prior discussion, evidence.
