name: "🔧 Task"
description: "Concrete work that is neither a feature nor a bug."
type: "Task"
body:
  - type: textarea
    id: what
    attributes:
      label: What has to be done
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The reason this is worth doing now.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How anyone can tell this is done. Checks that fail today and pass afterwards.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links, related issues, prior discussion, evidence.
